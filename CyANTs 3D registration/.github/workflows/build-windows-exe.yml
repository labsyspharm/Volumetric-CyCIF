name: Build Windows GUI EXE and Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd /C CALL {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          activate-environment: cyants
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install build tools
        run: |
          conda activate cyants
          python -m pip install --upgrade pyinstaller tkinterdnd2

      - name: Build CyANTs.exe
        run: |
          conda activate cyants
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build\pyinstaller packaging\windows\cyants_gui.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build CyANTs_Setup.exe
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" packaging\windows\installer\CyANTs_Setup.iss'

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyANTs-windows-exe
          path: dist/CyANTs.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyANTs-windows-installer
          path: dist/CyANTs_Setup.exe
